# Release assembly (GenomeMaker results_v1.2, release_curation). Launch from introgression/:
#   nextflow run main.nf -params-file params/Porites_sp_v1_2.yaml
# Paths are relative to the launch directory; ../data/ holds links (see ../data/README.md).
name: Porites_sp_indonesia
fasta: ../data/results_v1.2/release_curation/Porites_sp_v1.2/genome/Porites_sp._Indonesia_ID_GA_Por_15.scaffolds.fa
mito: ../data/results_v1.2/release_curation/Porites_sp_v1.2/mitogenome/mitogenome.fasta
# AGP of the release assembly (join test of the robustness step); null = join test skipped
agp: ../data/results_v1.2/release_curation/Porites_sp_v1.2/genome/Porites_sp._Indonesia_ID_GA_Por_15.scaffolds.agp
# ONT reads of the same individual (Porechop-trimmed); link them to ../data/ont_reads.fastq.gz
reads: ../data/ont_reads.fastq.gz
min_scaffold_len: 10000000
outdir: results/Porites_sp_v1_2_nf
